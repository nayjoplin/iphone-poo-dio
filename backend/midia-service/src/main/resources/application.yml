server:
  port: 8084

spring:
  application:
    name: midia-service
  datasource:
    url: jdbc:h2:mem:midiadb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

cors:
  allowed-origins: http://localhost:4200,https://*.vercel.app

upload:
  diretorio: uploads/
