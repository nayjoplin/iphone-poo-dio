server:
  port: 8081

spring:
  application:
    name: usuario-service
  datasource:
    url: jdbc:h2:mem:usuariodb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: gft-bujo-digital-secret-key-2024-super-secure-token-generation
  expiration: 86400000

cors:
  allowed-origins: http://localhost:4200,https://*.vercel.app
